<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMR / BPR Scanner</title>
<meta name="theme-color" content="#0b6b2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BMR Scanner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #eaf0ed; }
  body { font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #13241b; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #eaf0ed; }
  #splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
            text-align: center; padding: 24px; background: #eaf0ed; transition: opacity .25s ease; }
  #splash img { width: 88px; height: 88px; }
  #splash p { margin: 0; color: #5a6b62; }
  #splash a { color: #0b6b2e; font-weight: 700; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #help { display: none; max-width: 300px; }
  @media (prefers-color-scheme: dark) {
    html, body, #splash, #app { background: #0e1612; }
    body { color: #e4eee8; } #splash p { color: #9cb0a5; } #splash a { color: #5bb974; }
  }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <strong>BMR / BPR Scanner</strong>
  <p>Opening the scanner…</p>
  <p id="help">Taking longer than usual. Check the phone's internet, or <a id="direct" href="#" target="_top">open the scanner directly</a>.</p>
</div>
<iframe id="app" title="BMR / BPR Scanner" allow="camera; clipboard-write; fullscreen"></iframe>

<script src="config.js"></script>
<script>
  const SCANNER_URL = (window.SCANNER_URL || '').trim();
  const app = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('direct').href = SCANNER_URL || '#';

  // ---- settings the scanner asks us to keep (PIN, operator, stage, auto-save) ----
  const KEY = 'bmr-settings', ALLOWED = ['pin', 'operator', 'mode', 'auto'];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const fromScanner = o => { try { return new URL(o).hostname.endsWith('-script.googleusercontent.com'); } catch (e) { return false; } };
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.bmr !== 1 || !fromScanner(e.origin)) return;
    if (d.type === 'hello') e.source.postMessage({ bmr: 1, type: 'settings', data: load() }, e.origin);
    if (d.type === 'set' && ALLOWED.indexOf(d.k) >= 0) {
      const s = load(); s[d.k] = String(d.v);
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (x) {}
    }
  });

  if (SCANNER_URL.indexOf('/exec') < 0) {
    splash.querySelector('p').textContent = 'Launcher not set up yet: paste the web app link into config.js.';
  } else {
    // Open the scanner without the phone's Google accounts attached (like Incognito).
    // This avoids Google's "unable to open the file" error when several accounts are signed in.
    app.setAttribute('credentialless', '');
    app.addEventListener('load', () => splash.classList.add('gone'));
    app.src = SCANNER_URL.replace(/\/macros\/u\/\d+\//, '/macros/');
    setTimeout(() => { if (!splash.classList.contains('gone')) document.getElementById('help').style.display = 'block'; }, 12000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
