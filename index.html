<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batch Record System</title>
<meta name="theme-color" content="#0b6b2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batch Records">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #eaf0ed; }
  body { font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #13241b; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #eaf0ed; }
  #splash { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
            text-align: center; padding: 24px; background: #eaf0ed; transition: opacity .25s ease; }
  #splash img { width: 88px; height: 88px; }
  #splash p { margin: 0; color: #5a6b62; }
  #splash a { color: #0b6b2e; font-weight: 700; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #help { display: none; max-width: 300px; }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #d6eadc; border-top-color: #0b6b2e; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* no-network screen: shown instead of Chrome's own offline page */
  #offline { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 12px;
             text-align: center; padding: 24px; background: #eaf0ed; }
  #offline[hidden] { display: none; }
  #offline img { width: 88px; height: 88px; }
  #offline strong { font-size: 20px; color: #b3261e; }
  #offline p { margin: 0; color: #5a6b62; max-width: 290px; font-size: 14px; }
  #offline button { margin-top: 6px; min-width: 180px; padding: 13px 18px; border: 0; border-radius: 12px; background: #0b6b2e;
                    color: #fff; font: 700 16px system-ui, sans-serif; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    html, body, #splash, #app, #offline { background: #0e1612; } #offline strong { color: #f2b8b5; } #offline p { color: #9cb0a5; }
    body { color: #e4eee8; } #splash p { color: #9cb0a5; } #splash a { color: #5bb974; }
  }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <strong>Batch Record System</strong>
  <div class="spinner" aria-hidden="true"></div>
  <p>Loading…</p>
  <p id="help">Taking longer than usual. Check the phone's internet, or <a id="direct" href="#" target="_top">open the scanner directly</a>.</p>
</div>
<div id="offline" role="alert" hidden>
  <img src="icon-192.png" alt="">
  <strong>No network connection</strong>
  <p id="offMsg">Check the phone's Wi-Fi or mobile data. The scanner opens by itself when the network is back.</p>
  <button type="button" id="retry">Try again</button>
</div>
<iframe id="app" title="Batch Record System" allow="camera; clipboard-write; fullscreen"></iframe>

<script src="config.js"></script>
<script>
  const SCANNER_URL = (window.SCANNER_URL || '').trim();
  const app = document.getElementById('app'), splash = document.getElementById('splash');
  document.getElementById('direct').href = SCANNER_URL || '#';

  // ---- settings the scanner asks us to keep (PIN, operator, stage, auto-save) ----
  const KEY = 'bmr-settings', ALLOWED = ['pin', 'operator', 'mode', 'auto'];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const fromScanner = o => { try { return new URL(o).hostname.endsWith('-script.googleusercontent.com'); } catch (e) { return false; } };
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.bmr !== 1 || !fromScanner(e.origin)) return;
    if (d.type === 'hello') e.source.postMessage({ bmr: 1, type: 'settings', data: load() }, e.origin);
    if (d.type === 'set' && ALLOWED.indexOf(d.k) >= 0) {
      const s = load(); s[d.k] = String(d.v);
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (x) {}
    }
  });

  if (SCANNER_URL.indexOf('/exec') < 0) {
    splash.querySelector('p').textContent = 'Launcher not set up yet: paste the web app link into config.js.';
  } else {
    // Open the scanner without the phone's Google accounts attached (like Incognito).
    // This avoids Google's "unable to open the file" error when several accounts are signed in.
    app.setAttribute('credentialless', '');
    const URL_ = SCANNER_URL.replace(/\/macros\/u\/\d+\//, '/macros/');
    const off = document.getElementById('offline'), offMsg = document.getElementById('offMsg');
    let loaded = false;   // true once the scanner has loaded while the phone was online
    const open = () => {
      if (!navigator.onLine) { off.hidden = false; return; }          // don't let Chrome show its offline page
      off.hidden = true; splash.classList.remove('gone'); loaded = false; app.src = URL_;
      setTimeout(() => { if (!loaded && navigator.onLine) document.getElementById('help').style.display = 'block'; }, 12000);
    };
    app.addEventListener('load', () => {
      if (!app.src) return;
      if (!navigator.onLine) { off.hidden = false; return; }          // that load was Chrome's error page
      loaded = true; splash.classList.add('gone');
    });
    window.addEventListener('offline', () => { off.hidden = false; });
    window.addEventListener('online', () => { if (loaded) off.hidden = true; else open(); });
    document.getElementById('retry').addEventListener('click', () => {
      if (!navigator.onLine) { offMsg.textContent = 'Still no network. Turn on Wi-Fi or mobile data, then try again.'; return; }
      loaded ? (off.hidden = true) : open();
    });
    open();
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
